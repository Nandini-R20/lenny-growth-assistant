<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lenny Growth Assistant</title>
  <meta name="description" content="Ask Lenny's Podcast. Every answer is grounded in transcripts and cites its source.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C2410C'/%3E%3Ctext x='16' y='23' font-family='Georgia' font-size='20' font-weight='700' fill='%23F6F1E7' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand"><span class="mark">L</span><div><b>Lenny</b><small>Growth Assistant</small></div></div>
    <button class="btn-new" id="newChat"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>New chat</button>
    <div class="side-label">Chats</div>
    <nav class="sessions" id="sessions" aria-label="Chats"></nav>
    <div class="side-foot"><span id="indexNote"></span><button class="ghost" id="themeBtn" aria-label="Toggle theme">Theme</button></div>
  </aside>

  <main class="chat">
    <header class="top">
      <button class="icon menu" id="menuBtn" aria-label="Open chats"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg></button>
      <h1 id="chatTitle">New chat</h1>
      <div class="seg" id="providerSeg" role="radiogroup" aria-label="Model"></div>
    </header>
    <div class="scroll" id="scroll"><div class="col" id="thread" aria-live="polite"></div></div>
    <footer class="composer">
      <div class="col">
        <div class="banner" id="banner" hidden></div>
        <div class="box">
          <textarea id="input" rows="1" placeholder="Ask about product, growth, hiring…" aria-label="Message"></textarea>
          <button class="send" id="send" aria-label="Send"></button>
        </div>
        <div class="hint">Enter to send · Shift+Enter for a new line · answers use only the indexed transcripts</div>
      </div>
    </footer>
  </main>

  <section class="panel" id="panel" aria-label="Artifact viewer">
    <div class="panel-in">
      <header class="panel-head">
        <div class="ptitle"><small id="pkind">Artifact</small><h2 id="ptitle">Untitled</h2></div>
        <div class="ptools">
          <div class="tabs" role="tablist"><button role="tab" id="tabPreview" aria-selected="true">Preview</button><button role="tab" id="tabSource" aria-selected="false">Source</button></div>
          <button class="ghost" id="copyBtn">Copy</button><button class="ghost" id="dlBtn">Download</button>
          <button class="icon" id="closePanel" aria-label="Close viewer"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
        </div>
      </header>
      <div class="pnote" id="pnote" hidden></div>
      <div class="pbody" id="pbody"></div>
    </div>
  </section>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="pop" id="pop" role="tooltip" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
