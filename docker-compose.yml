services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lenny-db
    environment:
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: lenny
      POSTGRES_DB: lenny
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: lenny-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lenny:lenny@db:5432/lenny
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      EMBED_MODEL: nomic-embed-text
      EMBED_DIM: "768"
      TOP_K: "6"
      MIN_SIMILARITY: "0.73"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

volumes:
  pgdata:
